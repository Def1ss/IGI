version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: fitness_db_container
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=fitness_db
      - POSTGRES_USER=fitness_admin
      - POSTGRES_PASSWORD=secure_strength_pass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitness_admin -d fitness_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: fitness_web_container
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py load_fitness_fixtures || true &&
             gunicorn fitness_club.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=fitness_club.settings.prod
      - SECRET_KEY=local_development_secret_key_112233
      - DEBUG=False
      - LOG_LEVEL=INFO
      - DB_NAME=fitness_db
      - DB_USER=fitness_admin
      - DB_PASSWORD=secure_strength_pass
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
