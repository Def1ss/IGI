{% extends 'base.html' %}

{% block title %}Удалить термин — ФОРСАЖ{% endblock %}

{% block content %}
<fieldset>
    <legend><b>⚠️ Подтверждение удаления</b></legend>
    <p>Вы уверены, что хотите удалить термин <b>«{{ term.term }}»</b>?</p>
    <p>{{ term.definition|truncatewords:20 }}</p>
    <hr>
    <form method="post" style="display:inline;">
        {% csrf_token %}
        <button type="submit">✅ Да, удалить</button>
    </form>
    <form method="get" action="{% url 'content:term_list' %}" style="display:inline;">
        <button type="submit">❌ Отмена</button>
    </form>
</fieldset>
{% endblock %}
