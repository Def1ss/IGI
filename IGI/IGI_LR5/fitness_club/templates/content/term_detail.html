{% extends 'base.html' %}

{% block title %}{{ term.term }} — Словарь ФОРСАЖ{% endblock %}

{% block content %}
<fieldset>
    <legend><b>📖 {{ term.term }}</b></legend>
    <p><strong>📂 Категория:</strong> {{ term.category }}</p>
    <hr>
    <p>{{ term.definition|linebreaks }}</p>
    <hr>
    <p><small>📅 Добавлено: {{ term.added_date|date:"d.m.Y" }}</small></p>
</fieldset>

<br>
<form method="get" action="{% url 'content:term_list' %}">
    <button type="submit">← К словарю</button>
</form>
{% endblock %}
