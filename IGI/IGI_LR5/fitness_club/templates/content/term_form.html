{% extends 'base.html' %}

{% block title %}{{ title }} — Словарь ФОРСАЖ{% endblock %}

{% block content %}
<fieldset>
    <legend><b>📝 {{ title }}</b></legend>
    <form method="post">
        {% csrf_token %}
        <table border="0" cellpadding="4">
            {{ form.as_table }}
            <tr>
                <td colspan="2" align="center">
                    <button type="submit">💾 Сохранить</button>
                </td>
            </tr>
        </table>
    </form>
    <br>
    <form method="get" action="{% url 'content:term_list' %}">
        <button type="submit">❌ Отмена</button>
    </form>
</fieldset>
{% endblock %}
