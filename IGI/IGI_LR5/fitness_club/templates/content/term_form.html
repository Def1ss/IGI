{% extends 'base.html' %}
{% block title %}{{ title }} — Словарь{% endblock %}
{% block content %}
<fieldset>
  <legend><b>{{ title }}</b></legend>
  <form method="post">
    {% csrf_token %}
    <table border="0" cellpadding="4">{{ form.as_table }}</table>
    <button type="submit">Сохранить</button>
  </form>
  <form method="get" action="{% url 'content:term_list' %}"><button type="submit">Отмена</button></form>
</fieldset>
{% endblock %}
