{% extends 'base.html' %}

{% block title %}FAQ — ФОРСАЖ{% endblock %}

{% block content %}
<h1>❓ Часто задаваемые вопросы</h1>

{% for item in faq_items %}
<fieldset>
    <legend><b>{{ item.question }}</b></legend>
    <p>{{ item.answer|linebreaks }}</p>
</fieldset>
{% empty %}
<p><i>Вопросы пока не добавлены.</i></p>
{% endfor %}
{% endblock %}
