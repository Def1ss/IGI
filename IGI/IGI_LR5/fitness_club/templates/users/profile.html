{% load currency_tags %}

<!-- Вместо hardcoded BYN -->
{% for type_key, price in card_prices.items %}
<form method="post" action="{% url 'users:purchase_club_card' %}">
    {% csrf_token %}
    <input type="hidden" name="card_type" value="{{ type_key }}">
    <strong>{{ type_key|title }}</strong> — {% convert_price price %}
    <input type="text" name="promo_code" placeholder="Промокод" size="15">
    <button type="submit">Купить</button>
</form>
{% endfor %}
