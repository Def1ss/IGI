{% extends 'base.html' %}
{% block title %}Вход — ФОРСАЖ{% endblock %}
{% block content %}
<section class="card" style="max-width:420px;">
  <h1>Вход</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Войти</button>
  </form>
  <p class="muted">Нет аккаунта? <a href="{% url 'users:register' %}">Зарегистрироваться</a></p>
</section>
{% endblock %}
