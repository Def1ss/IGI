{% extends 'base.html' %}
{% block title %}Регистрация во ФОРСАЖ{% endblock %}
{% block content %}
<h2>Регистрация нового клиента</h2>
<form method="post">
    {% csrf_token %}
    <table cellpadding="5">
        {{ form.as_table }}
        <tr>
            <td><label>Телефон для связи:</label></td>
            <td><input type="text" name="phone" required placeholder="+375..."></td>
        </tr>
    </table>
    <button type="submit">Зарегистрироваться</button>
</form>
{% endblock %}
