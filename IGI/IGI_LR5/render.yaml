services:
  - type: web
    name: forsazh-web
    runtime: image
    repo: https://github.com/Def1ss/IGI
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: POSTGRES_DB
        fromDatabase:
          name: forsazh-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: forsazh-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: forsazh-db
          property: password
      - key: POSTGRES_HOST
        fromDatabase:
          name: forsazh-db
          property: host
      - key: POSTGRES_PORT
        value: 5432
      - key: DATABASE_URL
        fromDatabase:
          name: forsazh-db
          property: connectionString

databases:
  - name: forsazh-db
    plan: free
    databaseName: forsazh
    user: forsazh_user